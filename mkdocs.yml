# The documentation site, published to GitHub Pages by .github/workflows/docs.yml.
# Every page under docs/ includes a Markdown file from the repository, and docs/
# mirrors the repository's layout, so the relative links between those files
# work both on GitHub and on the site. The API reference is generated from the
# Go source at build time, so Go must be on PATH. Local preview:
#   pip install -r docs/requirements.txt && mkdocs serve
site_name: goshieldnet
site_description: The ShieldNet protocol in Go, client and device roles
repo_url: https://github.com/shieldled/goshieldnet
repo_name: shieldled/goshieldnet
edit_uri: ""
site_url: https://shieldled.github.io/goshieldnet/
exclude_docs: |
  requirements.txt
  hooks/

# Generates the API reference (api/) from the Go source with `go doc` at build time.
hooks:
  - docs/hooks/api_reference.py

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Light mode

plugins:
  - search
  - include-markdown:
      rewrite_relative_urls: false
  # llms.txt and llms-full.txt (https://llmstxt.org) at the site root, for LLMs.
  - llmstxt:
      markdown_description: >-
        goshieldnet is the pure-Go implementation of ShieldNet, the encrypted protocol between ShieldLED controllers and LED devices: a client for ShieldLED devices (sledclient, discovery), the application payload codecs (sled), and the transport in both roles (v1).
      full_output: llms-full.txt
      sections:
        Start here:
          - index.md: What the library is, how ShieldNet works, and complete client and device examples
          - agents.md: Rules and entry points for LLMs and coding agents
        Examples:
          - examples/README.md: Two complete programs, a device and a controller, with their sources
        API reference:
          - api/index.md: Every public package, and every exported identifier A-Z
          - api/*.md
        Guides:
          - tuning.md: Measured cost, the KCP window and flush-interval knobs, and a sizing example
          - bringup-lessons.md: Porting and measurement traps that host tests cannot catch
        Optional:
          - changelog.md: Release notes

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Overview: index.md
  - Examples: examples/README.md
  - API reference: api/index.md
  - Guides:
      - Tuning: tuning.md
      - Bring-up lessons: bringup-lessons.md
  - For AI assistants: agents.md
  - Changelog: changelog.md
  - Specification: https://github.com/shieldled/shieldnet-protocol
