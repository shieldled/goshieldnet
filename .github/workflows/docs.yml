name: Docs

# Builds the MkDocs site (mkdocs.yml, docs/) on every pull request and push, and
# publishes it to GitHub Pages from main. The API reference is generated from
# the Go source with `go doc` at build time, so the build needs Go. One-time
# setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Local preview:
#   pip install -r docs/requirements.txt && mkdocs serve

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Never cancel a deployment half-way; superseded pull-request builds may go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The official image through Google's Docker Hub mirror.
    container:
      image: mirror.gcr.io/library/python:3.12-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install MkDocs
        run: pip install --no-cache-dir -r docs/requirements.txt
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
